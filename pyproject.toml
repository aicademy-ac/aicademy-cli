[project]
name = "aicademy"
version = "0.5.3"
description = "Aicademy Practice CLI — solve Kubernetes exam scenarios locally with KIND"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Aicademy", email = "info@aicademy.ac" }]
license = { text = "MIT" }
keywords = ["kubernetes", "cka", "ckad", "cks", "cli", "practice", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "kubernetes>=29.0.0",
    "docker>=7.0.0",
    "pydantic>=2.0",
    "packaging>=21.0",
    "keyring>=25.0.0",
    "questionary>=2.0.0",
]


[project.scripts]
aicademy = "aicademy_cli.main:cli_entry"

[project.urls]
Homepage = "https://aicademy.ac/practice"
Repository = "https://github.com/devcrypted/aicademy-cli"
Issues = "https://github.com/devcrypted/aicademy-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicademy_cli"]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8,<2.0",
    "ruff>=0.3",
    "respx>=0.22",
    "taskipy>=1.12",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]


[tool.taskipy.tasks]
test = "python -m pytest -v"
lint = "ruff check ."
fmt = "ruff format ."
typecheck = "mypy aicademy_cli"
check = "ruff check . && mypy aicademy_cli && python -m pytest -v"
build = "uv build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anyio.*"
follow_imports = "skip"

